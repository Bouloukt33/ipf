# =============================================================================
# Docker Compose — IPF Monorepo (5 Secondes Chrono)
# =============================================================================
#
# Utilisation :
#   Infra seule (Postgres+Redis) : docker compose up -d
#   Tout lancer (images prod) :    docker compose --profile app up -d --build
#   Dev avec hot-reload :          docker compose --profile dev up -d --build
#   Outils admin (pgAdmin...) :    docker compose --profile tools up -d
#   Arrêter :                      docker compose down
#   Tout nettoyer :                docker compose down -v
#
# Production réelle → docker-compose.prod.yml
#
# NOTE monorepo npm workspaces : tous les builds utilisent la RACINE du repo
# comme contexte (context: .) car le package-lock.json unique est à la racine.
# =============================================================================

services:
  # ===========================================================================
  # INFRASTRUCTURE
  # ===========================================================================

  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ipf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipf_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password_123}
      POSTGRES_DB: ${POSTGRES_DB:-ipf_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipf_admin} -d ${POSTGRES_DB:-ipf_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipf-network

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: ipf-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ipf-network

  # ===========================================================================
  # APPLICATIONS — images de production (profil "app")
  # docker compose --profile app up -d --build
  # ===========================================================================

  # API NestJS
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ipf-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      # development en local pour garder Swagger (/api/docs).
      # La prod réelle (docker-compose.prod.yml) force production.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ipf_admin}:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/${POSTGRES_DB:-ipf_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CONNECTION: ${AUTH0_CONNECTION:-Username-Password-Authentication}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - app
    networks:
      - ipf-network
    volumes:
      - ./contenu_5_secondes_chrono:/app/contenu_5_secondes_chrono

  # Web App Next.js
  web-app:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: ipf-web-app
    restart: unless-stopped
    ports:
      - "${WEB_APP_PORT:-3001}:3001"
    environment:
      # Build standalone Next.js = toujours production
      NODE_ENV: production
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_BASE_URL: ${AUTH0_BASE_URL:-http://localhost:3001}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      API_INTERNAL_URL: http://api:3000
    depends_on:
      - api
    profiles:
      - app
    networks:
      - ipf-network

  # Landing Next.js
  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    container_name: ipf-landing
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-3004}:3004"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${APP_BASE_URL:-http://localhost:3001}
    profiles:
      - app
    networks:
      - ipf-network

  # Web Admin React/Vite (servi par Nginx)
  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        VITE_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
    container_name: ipf-web-admin
    restart: unless-stopped
    ports:
      - "${WEB_ADMIN_PORT:-3002}:80"
    depends_on:
      - api
    profiles:
      - app
      - admin
    networks:
      - ipf-network

  # ===========================================================================
  # DÉVELOPPEMENT avec hot-reload (profil "dev")
  # docker compose --profile dev up -d --build
  # Le code source est monté en volume → modifications visibles en live
  # ===========================================================================

  # API NestJS — dev
  api-dev:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: ipf-api-dev
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
      - "9229:9229" # debug Node.js
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ipf_admin}:${POSTGRES_PASSWORD:-dev_password_123}@postgres:5432/${POSTGRES_DB:-ipf_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CONNECTION: ${AUTH0_CONNECTION:-Username-Password-Authentication}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - dev
    networks:
      - ipf-network
    volumes:
      - ./apps/api:/repo/apps/api
      - ./contenu_5_secondes_chrono:/repo/apps/api/contenu_5_secondes_chrono

  # Web App Next.js — dev
  web-app-dev:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile.dev
    container_name: ipf-web-app-dev
    restart: unless-stopped
    ports:
      - "${WEB_APP_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_SECRET: ${AUTH0_SECRET}
      AUTH0_BASE_URL: ${AUTH0_BASE_URL:-http://localhost:3001}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      AUTH0_ISSUER_BASE_URL: ${AUTH0_ISSUER_BASE_URL}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      API_INTERNAL_URL: http://api-dev:3000
    depends_on:
      - api-dev
    profiles:
      - dev
    networks:
      - ipf-network
    volumes:
      - ./apps/web-app:/repo/apps/web-app
      - web_app_next_cache:/repo/apps/web-app/.next

  # Landing Next.js — dev
  landing-dev:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile.dev
    container_name: ipf-landing-dev
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-3004}:3004"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: ${APP_BASE_URL:-http://localhost:3001}
    profiles:
      - dev
    networks:
      - ipf-network
    volumes:
      - ./apps/landing:/repo/apps/landing
      - landing_next_cache:/repo/apps/landing/.next

  # ===========================================================================
  # OUTILS DE DEV (profil "tools")
  # ===========================================================================

  # pgAdmin — Interface web pour PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ipf-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ipf.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    profiles:
      - tools
    networks:
      - ipf-network

  # Redis Commander — Interface web pour Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ipf-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    profiles:
      - tools
    networks:
      - ipf-network

# =============================================================================
# VOLUMES & NETWORKS
# =============================================================================

volumes:
  postgres_data:
    name: ipf-postgres-data
  redis_data:
    name: ipf-redis-data
  web_app_next_cache:
    name: ipf-web-app-next-cache
  landing_next_cache:
    name: ipf-landing-next-cache

networks:
  ipf-network:
    name: ipf-network
    driver: bridge
